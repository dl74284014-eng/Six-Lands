function battle(A,D){
  const ma=tacMods(A.tac,D.tac),md=tacMods(D.tac,A.tac);
  const siegeN=A.g.filter(x=>x.type==='siege').reduce((a,x)=>a+x.n,0);
  const brk=Math.min(1,siegeN*.25);
  const wallMul=1/(1+(D.wall/50)*(1-brk));
  const contrib={};const rounds=[];
  const hit=(S,T,ms,mt,volley,wm,tag)=>{
    const tot=T.g.reduce((a,x)=>a+x.n,0);const dmg=T.g.map(()=>0);if(tot<=0)return dmg;
    S.g.forEach(x=>{if(x.n<=0||(volley&&!RANGED[x.type]))return;
      const p=x.n*x.atk*ms.atk*((x.type==='cav'||x.type==='arch')?ms.flank:1)*(volley?.8:1);
      T.g.forEach((y,j)=>{if(y.n<=0)return;const mx=MX[x.type][y.type];const d=p*(y.n/tot)*mx*(RANGED[x.type]?mt.arrow:1);dmg[j]+=d;
        if(mx>1.1&&!y.fixed){const k=tag+'|'+x.type+'|'+y.type;contrib[k]=(contrib[k]||0)+d}})});
    return T.g.map((y,j)=>Math.min(y.n,dmg[j]/(y.hp*5)*mt.loss*wm));
  };
  for(let r=0;r<3;r++){
    const volley=r===0;
    const lD=hit(A,D,ma,md,volley,wallMul,'a'),lA=hit(D,A,md,ma,volley,1,'d');
    D.g.forEach((y,j)=>y.n-=lD[j]);A.g.forEach((y,j)=>y.n-=lA[j]);
    rounds.push({volley,a:lA.reduce((x,y)=>x+y,0),d:lD.reduce((x,y)=>x+y,0)});
  }
  const pa=sidePow(A),pd=sidePow(D);
  const hl=[];['a','d'].forEach(tag=>{const best=Object.entries(contrib).filter(([k])=>k[0]===tag).sort((a,b)=>b[1]-a[1])[0];if(best){const[,x,y]=best[0].split('|');hl.push({tag,x,y})}});
  LASTRES={win:pa>pd*1.05,A,D};
  return{win:pa>pd*1.05,A,D,ma,md,rounds,hl,pa,pd,brk,wallMul};
}

    const cv=document.createElement('canvas');cv.width=360;cv.height=540;const g=cv.getContext('2d');
    for(let p=0;p<2;p++){
      const im=new Image();im.src='img/atlas_'+c+'_'+p+'.jpg';
      try{await im.decode()}catch(e){continue}
      const part=ATL[c].slice(p*50,p*50+50);

}

function mkTex(){
  const R=(a,b)=>a+Math.random()*(b-a);
  const base=(g,c)=>{g.fillStyle=c;g.fillRect(0,0,96,120)};
  const blades=(g,n,cols)=>{g.lineWidth=1;for(let k=0;k<n;k++){g.strokeStyle=cols[k%cols.length];const x=R(0,96),y=R(0,120);g.beginPath();g.moveTo(x,y);g.lineTo(x+R(-1.5,1.5),y-R(2,5));g.stroke()}};
  const make=fn=>{const c=document.createElement('canvas');c.width=96;c.height=120;const g=c.getContext('2d');fn(g);return c.toDataURL()};
  const T={};
  T.plain=make(g=>{base(g,'#33562f');blades(g,260,['#3e6a39','#2a4827','#4a7a41'])});
  T.edge=make(g=>{base(g,'#2e4f2c');blades(g,160,['#3a6236','#223e22'])});
  T.rock=make(g=>{base(g,'#3a4733');blades(g,90,['#4a5a40','#2d3a29'])});
  T.ley=make(g=>{base(g,'#2f4f30');blades(g,200,['#3c6638','#284526'])});
  return T;
}

function idbAll(){return new Promise(res=>{if(!db)return res();try{const rq=db.transaction('img').objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){IMG[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}})}
function idbPut(k,v){try{if(db){const st=db.transaction('img','readwrite').objectStore('img');v==null?st.delete(k):st.put(v,k)}}catch(e){}}
function toDataURL(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(file.type==='image/jpeg'?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png'))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function setImg(k,file,quiet){const u=await toDataURL(file,480);IMG[k]=u;idbPut(k,u);if(!quiet){imgCSS();render()}}

function costSpans(c,mult=1){return Object.entries(c).map(([r,n])=>{n=Math.ceil(n*mult);return`<span class="${s.res[r]>=n?'':'lack'}">${n}${RI[r]}</span>`}).join('')}
function effText(d){
  const p=[];
  if(d.cap)p.push(`${d.cap}<i class="ico i-home"></i>`);
  if(d.prod)p.push(Object.entries(d.prod).map(([r,n])=>`+${n}${RI[r]}`).join(' '));
  if(d.use)p.push(Object.entries(d.use).map(([r,n])=>`−${n}${RI[r]}`).join(' '));
  if(d.def)p.push(`+${d.def}<i class="ico i-def"></i>`);
  if(d.happy)p.push(`+${d.happy}<i class="ico i-happy"></i>`);
  if(SCI[d.id])p.push(`+${SCI[d.id]}${I('science')}`);
  if(CUL[d.id])p.push(`+${CUL[d.id]}${I('culture')}`);
  if(d.rep)p.push(`+${d.rep}<i class="ico i-fame"></i>`);
  if(d.god)p.push('+1.5<i class="ico i-favor"></i>');
  if(d.jobs)p.push(`${d.jobs}<i class="ico i-jobs"></i>`);
  return p.join(' · ')||d.desc;
}

function stats(){
  const cT=capT(),P=pop(),se=season();
  const stock={...s.res};const off=new Map();const act=[];
  const towerOn=cnt('tower')>0&&here('tower');
  s.lands.forEach((l,i)=>{
    const d=l.b&&B[l.b];if(!d)return;
    if(busy(l)){off.set(i,'Строится');return}
    if(d.master&&!here(d.master)){off.set(i,'Нет мастера');return}
    if(d.tower&&!towerOn){off.set(i,'Нужна Башня мага');return}
    if(d.use){const miss=Object.entries(d.use).find(([r,n])=>stock[r]<n);if(miss){off.set(i,'Нет: '+RN[miss[0]].toLowerCase());return}for(const[r,n]of Object.entries(d.use))stock[r]-=n}
    act.push({i,l,d});
  });
  const has=id=>act.some(x=>x.d.id===id);
  const jobs=act.reduce((a,x)=>a+(x.d.jobs||0),0);
  const eff=jobs?Math.min(1,P/jobs):1;
  const tools=has('smithy')?1.25:1;
  let farmSeason=se.farm;if(se.i===3)farmSeason=MOD('winter')!==1?MOD('winter'):se.farm;if(se.i===3&&hasRel('icecrown'))farmSeason=Math.max(farmSeason,.8);if(buff('ward'))farmSeason=Math.max(1,farmSeason);farmSeason*=WXo().farm||1;
  const farmM=farmSeason*MOD('farm')*(1+.3*lvl('harvest'))*(has('mill')?1.2:1)*(buff('bloom')?2:1);
  const forge=1+.25*lvl('forge'),manaM=(1+.4*lvl('magic'))*MOD('mana');
  const delta={gold:0,wood:0,stone:0,food:0,mana:0};const br={gold:{},wood:{},stone:{},food:{},mana:{},sci:{},cult:{}};let sci=0,cult=0;const add=(r,l,n)=>{br[r][l]=(br[r][l]||0)+n};
  let happy=50,rep=0,def=s.defBonus;const seen={};const hp=[];
  act.forEach(x=>{
    const d=x.d;let m=d.id==='hall'?1:eff;
    if(d.id==='farm')m*=farmM;
    if(d.id==='lumber')m*=tools*forge*MOD('wood');
    if(d.id==='quarry')m*=tools*forge*MOD('stone');
    if(d.ley&&x.l.t==='ley')m*=d.ley;
    if(d.prod)for(const[r,n]of Object.entries(d.prod)){const v=n*m*(r==='mana'?manaM:1)*(r==='gold'&&d.cat==='shop'?MOD('shop'):1);delta[r]+=v;add(r,d.n,v)}
    if(d.use)for(const[r,n]of Object.entries(d.use)){delta[r]-=n;add(r,d.n,-n)}
    if(d.happy){seen[d.id]=(seen[d.id]||0)+1;happy+=d.happy*Math.pow(.5,seen[d.id]-1)}
    if(d.rep)rep+=d.rep;
    if(SCI[d.id]){const v=SCI[d.id]*(d.id==='hall'?1:eff);sci+=v;add('sci',d.n,v)}
    if(CUL[d.id]){const v=CUL[d.id]*(d.id==='hall'?1:eff);cult+=v;add('cult',d.n,v)}
    if(d.def)def+=d.def*(d.jobs?Math.max(.5,eff):1);
  });
  const bdef=(def+csDef()+6*lvl('guard')+(buff('skin')?10:0)+(buff('horn')?20:0))*MOD('def');def=bdef+armyDef()*MOD('def');
  UNITS.forEach(u=>{const k=s.army[u.id]||0;if(k)for(const[r,n]of Object.entries(u.up)){delta[r]-=n*k*MOD('upkeep');add(r,'Содержание армии',-n*k*MOD('upkeep'))}});
  CITIES.forEach(c=>{const b=csBonus(c);if(b.gold){delta.gold+=b.gold;add('gold',c.n,b.gold)}if(b.mana){delta.mana+=b.mana;add('mana',c.n,b.mana)}});
  s.rivals.forEach(r=>{if(r.vassal){const t=hasC('empire')?8:4;delta.gold+=t;add('gold','Дань вассалов',t)}if(r.trade&&!r.war){delta.gold+=3;add('gold','Торговые договоры',3)}});
  const th=threat();
  hp.push(['Постройки',happy-50]);
  if(MOD('happy')){happy+=MOD('happy');hp.push([`Народ: ${C().n}`,MOD('happy')])}
  const taxH={low:8,normal:0,high:-14}[s.tax];happy+=taxH;hp.push(['Налоги',taxH]);
  const mv=mcount()*1.5;happy+=mv;hp.push(['Мастера в деревне',mv]);
  if(lvl('hearth')){happy+=6*lvl('hearth');hp.push([`Благословение: ${gN('hearth')}`,6*lvl('hearth')])}
  if(buff('fest')){happy+=10;hp.push(['Праздник',10])}
  if(buff('scare')){happy-=8;hp.push(['Страх после набега',-8])}
  {const actSet=new Set(act.map(x=>x.i));let ah=0;act.forEach(x=>adjOf(x.i,actSet).forEach(a=>{for(const[k,v]of Object.entries(a.fx)){if(k==='happy')ah+=v;else if(k==='def')def+=v;else if(k==='sci'){sci+=v;add('sci','Соседство',v)}else if(k==='cult'){cult+=v;add('cult','Соседство',v)}else{delta[k]+=v;add(k,'Соседство',v)}}}));if(ah){happy+=ah;hp.push(['Соседство',ah])}}
  def+=extraDef();
  if(def>=th){happy+=3;hp.push(['Чувство защищённости',3])}else if(def<th/2){happy-=5;hp.push(['Слабая оборона',-5])}
  delta.food-=P*.5;add('food','Жители едят',-P*.5);
  if(WXo().eat){delta.food-=P*WXo().eat;add('food','Мороз',-P*WXo().eat)}
  if(s.gw&&s.gw.built.length){const h=gwSum('happy');if(h){happy+=h;hp.push(['Великие стройки',h])}for(const k of ['food','gold']){const v=gwSum(k);if(v){delta[k]+=v;add(k,'Великие стройки',v)}}const a=gwSum('sci'),b=gwSum('cult');if(a){sci+=a;add('sci','Великие стройки',a)}if(b){cult+=b;add('cult','Великие стройки',b)}}
  {const mu=mercUp();if(mu){delta.gold-=mu;add('gold','Наёмники',-mu)}}
  if(relicSum('happy')){happy+=relicSum('happy');hp.push(['Реликвии',relicSum('happy')])}
  if(WXo().happy){happy+=WXo().happy;hp.push(['Погода: '+WXo().n,WXo().happy])}
  const starving=s.res.food+delta.food<0;
  const shortage=!starving&&delta.food<0&&s.res.food<-delta.food*12;
  if(starving){happy-=25;hp.push(['Голод',-25])}else if(shortage){happy-=8;hp.push(['Нехватка еды',-8])}
  if(cT&&P>=cT){happy-=4;hp.push(['Теснота',-4])}
  happy=Math.max(0,Math.min(100,happy));
  const rate={low:.25,normal:.5,high:.85}[s.tax];
  const taxes=P*rate*(.5+happy/100)*(1+.15*act.filter(x=>x.d.id==='market').length)*MOD('tax')*(1+.2*lvl('trade'))*DF().inc;
  delta.gold+=taxes;add('gold','Налоги',taxes);
  const ps=P*.2;sci+=ps;add('sci','Жители',ps);const pc=P*.1;cult+=pc;add('cult','Жители',pc);
  if(happy>=70){cult+=1;add('cult','Счастливый народ',1)}
  if(here('library')){sci+=1;add('sci','Хранитель знаний',1)}
  if(here('theater')){cult+=1;add('cult','Актёр и бард',1)}
  CITIES.forEach(c=>{const b=csBonus(c);if(b.sci){sci+=b.sci;add('sci',c.n,b.sci)}if(b.cult){cult+=b.cult;add('cult',c.n,b.cult)}});
  if(s.bSci){sci+=s.bSci;add('sci','Академии великих учёных',s.bSci)}if(s.bCult){cult+=s.bCult;add('cult','Школы великих художников',s.bCult)}
  const sm=MOD('sci'),cm=MOD('cult');if(sm!==1)add('sci','Бонусы',sci*(sm-1));if(cm!==1)add('cult','Бонусы',cult*(cm-1));sci*=sm;cult*=cm;
  rep+=(happy>=70?.15:0)-(happy<30?.2:0);
  return{sci,cult,bdef,br,capT:cT,P,jobs,eff,delta,happy,rep,off,act,has,taxes,hp,starving,shortage,season:se,def:Math.round(def),threat:th};
}

  for(const r of RES)s.res[r]=Math.max(0,s.res[r]+st.delta[r]);
  s.rep=Math.max(0,Math.min(100,s.rep+st.rep));s.happy=st.happy;
  s.day++;
  wxRoll();
  s.lands.forEach(l=>{if(!(l.bt>0))return;l.bt--;if(l.bt>0)return;delete l.bt;
    if(l.up){const was=B[l.b].n;l.b=l.up;delete l.up;log(`Улучшено: ${was} → ${B[l.b].n}.`,'good');REPORT0.push([`Улучшено: ${B[l.b].n}`,`${was} перестроен. Постройка уже работает.`,'good'])}

    if(st.has('temple'))f+=.3;
    f=Math.max(0,Math.min(100,f-.25));s.favor[g.id]=f;
    const after=lvl(g.id);

  });
  for(const k in s.buffs)if(s.buffs[k]<=s.day){delete s.buffs[k];if(BUFFN[k])log(`Закончилось действие: ${BUFFN[k]}.`)}

  const free=st.capT-pop();

    const ch=.22+(st.has('tavern')?.08:0)+(st.has('portal')?.12:0)+.05*lvl('hearth')+MOD('settle')+(st.happy-45)/220;
    let k=0;if(rnd()<ch)k++;if(free>5&&rnd()<ch*.6)k++;k=Math.min(k,free);

  }

    if(g)REPORT0.push(['Голод',`${g>1?g+' семьи ушли':'Одна семья ушла'} из деревни: амбары пусты. Постройте ферму или купите еду на рынке.`,'bad'])}
  else if(st.shortage&&rnd()<.25){if(loseFamily('Еды не хватает:'))REPORT0.push(['Еды не хватает','Еды тратится больше, чем добывается, и запасы тают. Одна семья ушла искать сытую жизнь.','bad'])}
  else if(st.happy<25&&rnd()<.3)loseFamily('От недовольства');
  if(s.pop.p>st.capT)s.pop.p=Math.max(mcount(),st.capT);
  while(s.rank<RANKS.length-1&&RANKS[s.rank+1].ok()){s.rank++;s.rep=Math.min(100,s.rep+5);sfx('good');log(`Деревня получает звание «${RANKS[s.rank].n}»! Слава +5.`,'arc');toast('Новое звание: '+RANKS[s.rank].n)}
  trainTurn();
  REPORT=REPORT0;REPORT0=[];aiTurn();
  progTurn(st);greatTurn(st);checkQuests(true);tradeTurn();spyTurn();featTurn(st);

  if(!s.won&&(s.rivals.every(r=>r.vassal)||s.rank>=RANKS.length-1||hasT('final')||hasC('golden'))){s.won=true;s.sumDue=1;REPORT.push(['Победа!',s.rivals.every(r=>r.vassal)?'Военная победа: все народы признали вашу власть.':hasT('final')?'Научная победа: ваш народ совершил Великое открытие.':hasC('golden')?'Культурная победа: настал Золотой век.':'Ваша деревня стала Городом чудес.','good'])}
  if(s.trip&&s.day>=s.trip.at)persuade();

function trainTurn(){
  const slots=cnt('barracks')&&here('barracks')?2:1;
  for(let i=0;i<Math.min(slots,s.queue.length);i++)s.queue[i].left--;
  const done=s.queue.filter(q=>q.left<=0);s.queue=s.queue.filter(q=>q.left>0);
  done.forEach(q=>{const k0=s.army[q.u]||0;if(s.vet&&s.vet[q.u])s.vet[q.u]=s.vet[q.u]*k0/(k0+1);s.army[q.u]=k0+1;log(`Обучен воин: ${U[q.u].n}.`,'good')});
  if(done.length)sfx('build');
}
function casualties(frac){
  let lost=0;UNITS.forEach(u=>{const k=s.army[u.id]||0;if(!k)return;let d=Math.min(k,Math.floor(k*frac+rnd()));s.army[u.id]=k-d;lost+=d});return lost;
}

  $('#ut').onclick=()=>{if(!ok)return;pay(u.cost);s.queue.push({u:id,left:uTurns(u)});sfx('card');log(`Начато обучение: ${u.n} (${uTurns(u)} ход.).`);closeModal();save();render()};
}

/* ---------- соседние народы ---------- */
let REPORT=[],PEACE=null;
function rivalName(r){return CULTURES[r.c].n}
function relText(r){return r.vassal?'Вассал':r.war?'Война':r.rel>=40?'Дружба':r.rel>=10?'Хорошие':r.rel>-10?'Нейтралитет':r.rel>-30?'Натянутые':'Враждебные'}
function aiTurn(){
  PEACE=null;
  s.rivals.forEach(r=>{
    if(r.vassal)return;
    const ag=CULTURES[r.c].aggr;
    const pT=Math.min(85,8+s.day*.13+pop()*.25);r.pop=Math.max(2,r.pop+(pT-r.pop)*.03+(rnd()-.4)*.3);
    const dA=DF().ag;const target=((r.pop*.12+s.day*.025)*ag+armySize()*.3)*DF().am;r.army=Math.max(0,r.army+(target-r.army)*.08+(rnd()-.4)*.3);
    r.wall+=.03;r.gold+=1+r.pop*.08;
    if(r.war){
      r.warT++;
      if(r.army>3&&!(r.raidCd>s.day)&&rnd()<.14*ag*dA*(WXo().raid||1)){enemyAttack(r);r.raidCd=s.day+5}
      if(!PEACE&&((r.army*2<myPower()*.6&&rnd()<.25)||(r.warT>12&&rnd()<.15)))PEACE=r;
    }else{
      const base=-(ag-1)*70-(s.lands.length>12?(s.lands.length-12)*1.5:0)+(r.trade?25:0);
      r.rel+=(base+(r.ally?30:0)+(r.wed?15:0)+(r.pact>s.day?10:0)-r.rel)*.03;if(r.wed)r.rel=Math.max(r.rel,10);
      if(s.day>15&&!(r.pact>s.day)&&!r.ally&&rnd()<.012*ag*dA){r.rel-=12+rnd()*10;log(`Стычка на границе с народом «${rivalName(r)}». Отношения портятся.`,'bad')}
      if(s.day>40&&pop()>=12&&!s.rivals.some(o=>o.war)&&r.rel<-25&&!(r.pact>s.day)&&!r.ally&&r.army>armySize()*.6&&rnd()<.05*ag*dA){r.war=true;r.warT=0;r.trade=false;r.rel=-100;REPORT.push([`Народ «${rivalName(r)}» объявляет войну!`,'Их армия выступила в поход. Готовьте оборону.','bad']);sfx('war')}
    }
  });
}
function enemyAttack(r){
  const n=rivalName(r);
  if(buff('mirage')){delete s.buffs.mirage;r.army*=.85;REPORT.push([`Набег: ${n}`,'Войско врага заблудилось в мираже и ушло.','good']);return}
  const A=rivalSide(r,{attacking:true}),D=mySide({home:true,vs:r});if(hasIntel(s.rivals.indexOf(r)))A.g.forEach(x=>x.atk*=.85);const res=battle(A,D);
  applyMyLosses(D);r.army=remainArmy(A);const html=battleHTML(res,false);
  if(!res.win){s.rep=Math.min(100,s.rep+2);s.wins=(s.wins||0)+1;s.gp.war++;REPORT.push([`Набег отбит: ${n}`,`Враг отступил. Слава +2.`,'good',html]);sfx('good')}
  else if(res.pa<res.pd*2.2){const g=Math.round(s.res.gold*.15),f=Math.round(s.res.food*.15);s.res.gold-=g;s.res.food-=f;REPORT.push([`Тяжёлый бой: ${n}`,`Враг прорвался и унёс ${g} золота и ${f} еды.`,'bad',html]);sfx('bad')}
  else{const g=Math.round(s.res.gold*.2),f=Math.round(s.res.food*.2),w=Math.round(s.res.wood*.2);s.res.gold-=g;s.res.food-=f;s.res.wood-=w;s.buffs.scare=s.day+6;loseFamily('После разорения');REPORT.push([`Деревня разграблена: ${n}`,`Потеряно ${g} золота, ${f} еды, ${w} дерева, одна семья ушла.`,'bad',html]);sfx('bad')}
}
function tacCard(k,o={}){const t=TACT[k];return card({cls:`c-unit ${o.cls||''}`,name:t.n,artCls:'cat',art:`<span class="emo">${t.ic}</span>`,text:`${t.d} Бьёт «${TACT[t.beats].n}».`,attrs:o.attrs||'',el:o.el})}
function attackRival(i,tac){
  const r=s.rivals[i];if(!r.war||!armySize())return;const n=rivalName(r);
  if(!tac){
    const est=rivalCounts(r,false);
    openModal(`<h2>Поход на народ «${n}»</h2>
      <p class="small">Разведка: у врага около ${Math.round(r.army)} воинов, стены ${Math.round(r.wall*3)}. Их любимая тактика — <b>${TACT[favTac(r.c)].n}</b>.</p>
      <div class="small muted">${hasIntel(i)?'<b class="up">Точные сведения шпиона.</b> ':''}Состав: ${Object.entries(est).filter(([k,v])=>v>.3).map(([k,v])=>{const u=rivalUnit(r.c,k);return`${u.ic} ${u.n} ~${Math.round(v)}`}).join(' · ')}</div>
      <h3>Выберите тактику</h3><div class="cards picker">${TK.map(k=>tacCard(k,{attrs:`data-tc="${k}"`})).join('')}</div>
      <div class="small muted">Стена щитов бьёт Натиск, Натиск бьёт Обход, Обход бьёт Стену щитов. Осадные машины пробивают стены.</div>
      <button class="btn ghost" id="tcx">Отмена</button>`,true);
    $('#tcx').onclick=closeModal;document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{closeModal();attackRival(i,b.dataset.tc)});return;
  }
  s.rivals.forEach(o=>{if(o!==r&&!o.vassal&&!o.war)o.rel-=3});
  const A=mySide({tac,vs:r}),D=rivalSide(r,{home:true});const res=battle(A,D);
  applyMyLosses(A);r.army=remainArmy(D);let msg;
  if(res.win){
    const loot=Math.round(r.gold*.4+r.pop*2);s.res.gold+=loot;r.gold*=.6;r.pop*=.8;r.wall=Math.max(1,r.wall*.8);r.hits++;s.rep=Math.min(100,s.rep+3);
    msg=`<b class="up">Победа!</b> Добыча: ${loot} золота. Слава +3.`;
    if(r.hits>=3||r.pop<4){r.war=false;r.vassal=true;r.trade=false;msg+=` Народ «${n}» покорён и стал вашим вассалом: платит 4 золота за ход.`}
    sfx('good');log(`Поход на ${n}: победа.`,'good');s.wins=(s.wins||0)+1;s.gp.war++;
  }else{msg=`<b class="dn">Поражение.</b> Войско отступило.`;sfx('bad');log(`Поход на ${n}: поражение.`,'bad')}
  openModal(`<h2>Поход: ${n}</h2><p>${msg}</p>${battleHTML(res,true)}<button class="btn" id="rx">Дальше</button>`);$('#rx').onclick=()=>{closeModal();save();render()};
  save();
}
function peaceOffer(){
  const r=PEACE;PEACE=null;const n=rivalName(r);
  openModal(`<div class="cv">${rivalCard(r,{cls:'big',el:'div'})}<div class="info"><h2>${n} предлагает мир</h2><p>Война идёт уже ${r.warT} ход. Посол ждёт ответа.</p></div></div>
    <div class="stack"><button class="opt" id="pa"><span>Принять мир</span></button><button class="opt" id="pd"><span>Продолжить войну</span></button></div>`);
  $('#pa').onclick=()=>{r.war=false;r.rel=-10;r.warT=0;log(`Мир с народом «${n}».`,'good');closeModal();save();render()};

}
function showReport(){
  openModal(`<h2>Итоги хода ${s.day}</h2><div class="stack">${REPORT.map(([h,t,k,x])=>`<div class="m"><b class="${k==='good'?'up':'dn'}">${h}</b><span class="small">${t}</span>${x||''}</div>`).join('')}</div><button class="btn" id="rpx">Дальше</button>`);
  REPORT.forEach(([h,t,k])=>log(`${h} ${t}`,k));

function peaceChance(r){return Math.max(.05,Math.min(.9,.15+(hasC('diplomacy')?.15:0)+(myPower()/(r.army*2+1))*.35+r.warT*.01))}
function openRival(i){
  const r=s.rivals[i];const n=rivalName(r);const cu=CULTURES[r.c];const cd=(s.peaceCd[r.c]||0)>s.day;

  }else{
    acts.push(`<button class="btn ghost" id="rg" ${s.res.gold>=30?'':'disabled'}><i class="ico i-gift"></i> Подарок: 30<i class="ico i-gold"></i> → отношения +15</button>`);
    if(!r.trade)acts.push(`<button class="btn ghost" id="rt" ${r.rel>=25&&cnt('market')&&hasT('currency')&&s.res.gold>=20?'':'disabled'}><i class="ico i-trade"></i> Торговый договор: 20<i class="ico i-gold"></i> → +3<i class="ico i-gold"></i> за ход</button>`);
    acts.push(...dipActs(r,i));
    acts.push(`<button class="btn ghost" id="rw" style="color:var(--bad)" ${r.pact>s.day||r.ally?'disabled':''}><i class="ico i-war"></i> Объявить войну${r.pact>s.day?' (действует договор)':r.ally?' (союзник)':''}</button>`);
  }

    <div class="small">Семей: ${Math.round(r.pop)} · Армия: ~${Math.round(r.army)} воин. · Стены: ${Math.round(r.wall*3)}</div><div class="small">Любимая тактика: ${TACT[favTac(r.c)].ic} ${TACT[favTac(r.c)].n} · Особый воин: ${cu.unit.ic} ${cu.unit.n} (${TY[uType(cu.unit)].n.toLowerCase()})</div>
    <div class="small">Отношения: ${relText(r)}${r.war||r.vassal?'':` (${Math.round(r.rel)})`}${r.trade?' · торговый договор':''}${r.war?` · война ${r.warT} ход.`:''}</div>${dipStatus(r)?`<div class="small up">${dipStatus(r)}</div>`:''}
    <div class="small muted">Сильные стороны: ${cu.bonus.join('; ')}. Слабые: ${cu.minus.join('; ')}.</div>
    ${!r.trade&&!r.war&&!r.vassal?'<div class="small muted">Для договора нужны отношения от 25 и Рынок.</div>':''}
    <div class="stack">${acts.join('')}</div><button class="btn ghost" id="rx">Закрыть</button></div></div>`,true);
  $('#rx').onclick=closeModal;

  on('#ra',()=>{closeModal();attackRival(i)});
  on('#rp',()=>{s.peaceCd[r.c]=s.day+3;if(rnd()<peaceChance(r)){r.war=false;r.rel=-10;r.warT=0;log(`Мир с народом «${n}».`,'good');toast('Мир заключён')}else{log(`${n} отвергает мир.`,'bad');toast('Предложение отвергнуто')}closeModal();save();render()});
  on('#rg',()=>{s.res.gold-=30;r.rel=Math.min(100,r.rel+(hasC('diplomacy')?22:15));sfx('coin');save();render();openRival(i)});
  on('#rt',()=>{s.res.gold-=20;r.trade=true;r.rel+=5;sfx('coin');log(`Торговый договор с народом «${n}».`,'good');save();render();openRival(i)});
  bindDip(r,i);
  on('#rw',()=>{if(r.pact>s.day||r.ally)return;r.war=true;r.warT=0;r.trade=false;r.rel=-100;s.rep=Math.max(0,s.rep-3);s.rivals.forEach(o=>{if(o!==r&&!o.vassal)o.rel-=10});sfx('war');log(`Вы объявили войну народу «${n}».`,'bad');save();render();openRival(i)});
}
function loseFamily(why){if(pop()>Math.max(2,mcount())){s.pop.p--;log(`${why} одна семья покинула деревню.`,'bad');return true}return false}

/* ---------- мастера ---------- */
function reqs(m){
  const out=m.req.map(q=>{
    if(q[0]==='pop')return{ok:pop()>=q[1],t:`${q[1]} жителей`};
    if(q[0]==='rep')return{ok:s.rep>=q[1],t:`Слава ${q[1]}`};
    if(q[0]==='b')return{ok:cnt(q[1])>=q[2],t:`${B[q[1]].n}${q[2]>1?' ×'+q[2]:''}`};
    if(q[0]==='m')return{ok:here(q[1]),t:`Мастер в деревне: ${M[q[1]].trade.toLowerCase()}`};
    if(q[0]==='res')return{ok:s.res[q[1]]>=q[2],t:`${q[2]} ${RN[q[1]].toLowerCase()} в запасе`};
  });
  out.push({ok:capT()-pop()>0,t:'Свободное место в доме'});
  return out;
}
function travel(id){
  const m=M[id];const days=tripDays(m);const cost=tripCost(m);
  if(s.trip||!reqs(m).every(r=>r.ok)||s.res.gold<cost)return;
  s.res.gold-=cost;sfx('card');s.trip={m:id,at:s.day+days};
  log(`Вы отправились в ${mTown(m)}, чтобы уговорить: ${mName(m)}.`,'arc');toast(`В пути: ${days} дн.`);closeModal();save();render();
}
function openMaster(id){
  const m=M[id];const rq=reqs(m);const ok=rq.every(r=>r.ok);const days=tripDays(m);const cost=tripCost(m);const cool=s.cool[m.id]>s.day;
  let act='';
  if(here(id))act=`<p class="muted">${mName(m)} живёт в деревне. ${cnt(id)?'Мастерская работает.':'Постройте карту «'+B[id].n+'».'}</p>${cnt(id)?'':`<button class="btn" id="goB">Открыть «${B[id].n}»</button>`}`;
  else if(s.trip&&s.trip.m===id)act=`<p class="muted">Вы в пути. Встреча на ${s.trip.at}-й день.</p>`;
  else act=`<h3>Условия</h3><ul class="req">${rq.map(r=>`<li class="${r.ok?'ok':'no'}">${r.t}</li>`).join('')}</ul>
    <button class="btn" id="goT" ${!ok||s.trip||cool||s.res.gold<cost?'disabled':''}>Отправиться · ${days} дн., ${cost}<i class="ico i-gold"></i></button>
    ${s.trip?'<span class="small muted">Вы уже в дороге к другому мастеру.</span>':cool?`<span class="small muted">Мастер думает ещё ${s.cool[id]-s.day} дн.</span>`:''}`;
  openModal(`<div class="cv">${masterCard(m,{cls:'big',el:'div'})}<div class="info"><h2>${mName(m)}</h2>
    <div class="row"><span class="pill">${m.trade}</span><span class="pill">${mTown(m)}</span></div>
    <div class="small muted">Откроет карту «${B[id].n}»: ${effText(B[id])}.</div>
    <p class="quote">«${m.line}»</p>${act}</div></div><button class="btn ghost" id="mx">Закрыть</button>`,true);
  $('#mx').onclick=closeModal;
  const t=$('#goT');if(t)t.onclick=()=>travel(id);
  const g=$('#goB');if(g)g.onclick=()=>openBuild(id);

function chanceBase(id){return Math.max(.05,Math.min(.95,.3+(hasC('hospitality')?.1:0)+s.rep*.005+(s.happy-50)*.004+(s.bonus[id]||0)+(s.dream||0)))}
function persuade(){
  const m=M[s.trip.m];
  if(!(capT()-pop()>0)){log(`${mName(m)}: «Мне негде будет жить». Постройте ещё дом.`,'bad');s.trip=null;s.cool[m.id]=s.day+2;return}

   <div class="small muted">Вы прибыли: ${mTown(m)}${s.dream?'. Вам заранее подсказали нужные слова (+25%)':''}</div>
   <p class="quote">«${m.line}»</p></div></div>
   <div class="stack">
    <button class="opt" id="po1"><span>Рассказать о деревне<br><span class="small muted">Шанс зависит от славы и счастья жителей</span></span><span class="p">${pct(b)}</span></button>
    <button class="opt" id="po2" ${s.res.gold<m.fee?'disabled':''}><span>Предложить подъёмные<br><span class="small muted">${m.fee}<i class="ico i-gold"></i> золотом</span></span><span class="p">${pct(b+.3)}</span></button>
    <button class="opt" id="po3" ${s.res.mana<mana?'disabled':''}><span>Магический довод<br><span class="small muted">${mana}<i class="ico i-mana"></i> на чудесную демонстрацию</span></span><span class="p">${pct(b+.22)}</span></button>
    <button class="btn ghost" id="po4">Вернуться ни с чем</button>
   </div>`);

      s.masters[m.id]='here';s.pop.p++;s.rep=Math.min(100,s.rep+4);delete s.bonus[m.id];

    }else{
      s.cool[m.id]=s.day+4;s.bonus[m.id]=(s.bonus[m.id]||0)+.1;

      closeModal();toast('Отказ. Через 4 дня можно попробовать снова');
    }
    save();render();
  };
  $('#po1').onclick=()=>go(b);
  $('#po2').onclick=()=>go(b+.3,{gold:m.fee});
  $('#po3').onclick=()=>go(b+.22,{mana});
  $('#po4').onclick=()=>{s.trip=null;log(`Вы вернулись от: ${mName(m)}, ничего не предложив.`);closeModal();save();render()};
}

/* ---------- колода судьбы ---------- */
function fight(power,name){
  if(buff('mirage')){delete s.buffs.mirage;s.rep=Math.min(100,s.rep+1);return`${name}: враг заблудился в мираже и ушёл ни с чем.`}
  const d=stats().def;
  if(d>=power){const g=Math.round(power*1.5);s.res.gold+=g;s.rep=Math.min(100,s.rep+2);return`${name} отбит! Трофеи: ${g} золота, слава +2.`}
  if(d>=power*.6){const l=Math.round(power*1.2);s.res.food=Math.max(0,s.res.food-l);s.res.gold=Math.max(0,s.res.gold-l);return`Отбились с трудом. Потери: ${l} еды и ${l} золота.`}
  const l=Math.round(power*2);s.res.food=Math.max(0,s.res.food-l);s.res.gold=Math.max(0,s.res.gold-l);s.res.wood=Math.max(0,s.res.wood-l);
  s.rep=Math.max(0,s.rep-2);s.buffs.scare=s.day+6;loseFamily('После разорения');
  return`Оборона не выдержала. Разграблено по ${l} еды, золота и дерева. Жители в страхе.`;
}
function raid(name,x,power,o={}){
  const d=stats().def;const est=buff('mirage')?'мираж':d>=power?'победа':d>=power*.6?'тяжёлый бой':'поражение';
  const opts=[[`Встретить у стен · ${d} <i class="ico i-def"></i> против ${power} (${est})`,()=>1,()=>fight(power,name)]];
  if(o.bribe)opts.push([`Откупиться: ${o.bribe}<i class="ico i-gold"></i>`,()=>s.res.gold>=o.bribe,()=>{s.res.gold-=o.bribe;return o.bt||'Враг ушёл с золотом.'}]);
  if(o.mana)opts.push([`Отогнать магией: ${o.mana}<i class="ico i-mana"></i>`,()=>s.res.mana>=o.mana,()=>{s.res.mana-=o.mana;s.rep=Math.min(100,s.rep+1);return'Чары обратили врага в бегство. Слава +1.'}]);
  if(o.extra)opts.push(o.extra);
  return{x:`${x} Сила врага ${power}, ваша оборона ${d}.`,o:opts,war:1};
}

function event(){
  const pool=EVENTS.filter(e=>e.when());
  const e=pool[(rnd()*pool.length)|0];const r=e.make();sfx(r.war?'war':'event');
  openModal(`<div class="cv">${card({cls:'c-fate big flip',name:e.t,artCls:'fate-art',art:artOfRaw('e_'+e.id,e.ic),text:'Карта судьбы',el:'div'})}
    <div class="info"><h2>${e.t}</h2><p>${r.x}</p></div></div>
    <div class="stack">${r.o.map((o,k)=>`<button class="opt" id="ev${k}" ${o[1]()?'':'disabled'}><span>${o[0]}</span></button>`).join('')}</div>`);
  r.o.forEach((o,k)=>$('#ev'+k).onclick=()=>{const t=o[2]();log(`${e.t}: ${t}`,'arc');closeModal();toast(t);save();render()});
}

function openModal(h,soft){modalOpen=!soft;if(!soft)stopTimer();$('#modal').innerHTML=h;const bg=$('#modalBg');bg.hidden=false;bg.classList.remove('in');void bg.offsetWidth;bg.classList.add('in');const f=$('#modal button:not(:disabled)');f&&f.focus()}
function closeModal(){const was=modalOpen;modalOpen=false;$('#modalBg').hidden=true;if(was)startTimer()}

/* ---------- строительство ---------- */
function lockReason(d){
  {const t=BTECH[d.id],c=BCIVIC[d.id];if(t&&!hasT(t))return`Нужна технология: ${TECH[t].n}`;if(c&&!hasC(c))return`Нужен институт: ${CIVIC[c].n}`}
  if(d.master&&!here(d.master))return`Нужен мастер: ${M[d.master].trade.toLowerCase()}`;
  if(d.tower&&!(cnt('tower')&&here('tower')))return'Нужна Башня мага';
  if((d.god||d.id==='wonder')&&s.lands.some(l=>l.b===d.id||l.up===d.id))return'Уже построено';
  const l=d.lock&&d.lock();return l||'';
}
function fitsLand(d,l){return !l.b&&(!d.land||d.land===l.t)}
function pickLand(d,want){
  if(want!=null&&s.lands[want]&&fitsLand(d,s.lands[want]))return want;
  const free=s.lands.map((l,i)=>({l,i})).filter(x=>!x.l.b);
  if(d.land){const f=free.find(x=>x.l.t===d.land);return f?f.i:-1}
  if(d.ley){const f=free.find(x=>x.l.t==='ley');if(f)return f.i}
  for(const t of['plain','edge','rock','ley']){const f=free.find(x=>x.l.t===t);if(f)return f.i}
  return-1;
}
function placeReason(d,want){return pickLand(d,want)<0?(d.land?`Нет свободного участка: ${LAND[d.land].n}`:'Нет свободных участков'):''}

 {k:'master',w:2,ok:()=>mcount()<ML.length,mk:()=>{const v=mcount()+1;return{v,t:'Уговорить нового мастера переехать'}},cur:()=>mcount()},

function qReward(){const lv=1+s.day/40;const r=[
  {gold:Math.round(40*lv)},{wood:Math.round(35*lv),stone:Math.round(20*lv)},{food:Math.round(40*lv)},{mana:Math.round(15*lv)},
  {sci:Math.round(20*lv)},{cult:Math.round(18*lv)},{rep:4}];return r[(rnd()*r.length)|0]}
function rewText(w){return Object.entries(w).map(([k,v])=>`+${v}${k==='sci'?I('science'):k==='cult'?I('culture'):k==='rep'?I('fame'):RI[k]}`).join(' ')}
function newQuest(){const used=s.quests.map(q=>q.k);const pool=QT.filter(t=>t.ok()&&!used.includes(t.k));let tot=pool.reduce((a,t)=>a+t.w,0),r=rnd()*tot;
  for(const t of pool){r-=t.w;if(r<=0)return{k:t.k,...t.mk(),rew:qReward()}}return null}
function fillQuests(){while(s.quests.length<3){const q=newQuest();if(!q)break;s.quests.push(q)}}
function qCur(q){return QT.find(t=>t.k===q.k).cur(q)}
function giveRew(w){for(const[k,v]of Object.entries(w)){if(k==='sci')s.tech.p+=v;else if(k==='cult'){s.civ.p+=v;s.cultTotal+=v}else if(k==='rep')s.rep=Math.min(100,s.rep+v);else s.res[k]+=v}}
function checkQuests(rep){
  let any=false;s.quests=s.quests.filter(q=>{if(qCur(q)>=q.v){giveRew(q.rew);s.qDone++;any=true;log(`Поручение выполнено: ${q.t}. Награда ${rewText(q.rew)}.`,'good');if(rep)REPORT.push(['Поручение выполнено',`${q.t}. Награда: ${rewText(q.rew)}.`,'good']);else toast('Поручение выполнено! '+rewText(q.rew));return false}return true});
  fillQuests();if(any)sfx('coin');
}
function openQuest(i){const q=s.quests[i];const c=Math.min(qCur(q),q.v);

    <div class="small">Награда: ${rewText(q.rew)}</div><div class="small muted">Жители и купцы просят старосту о делах. Выполненное поручение сразу приносит награду, а на его место приходит новое. Выполнено поручений: ${s.qDone}.</div>

  $('#qx').onclick=closeModal;$('#qr').onclick=()=>{s.res.gold-=10;const old=s.quests.splice(i,1)[0];const nq=newQuest();s.quests.splice(i,0,nq||old);closeModal();save();render()};

function progTurn(st){

      const nx=list.filter(x=>label==='Открыта технология'?canT(x):canC(x)).sort((a,b)=>a.cost-b.cost)[0];box.cur=null;cb&&cb(nx)}
  };
  run(s.tech,TECHS,TECH,st.sci,'Открыта технология');
  run(s.civ,CIVICS,CIVIC,st.cult,'Принят институт');
  s.cultTotal+=st.cult;
  while(s.cultTotal>=s.borderAt){
    s.borderAt+=Math.round(25+s.lands.length*4);

  }
}

function takeUnits(n,dry){const u={};let left=n;const L=UNITS.map(x=>x.id).filter(id=>(s.army[id]||0)>0).sort((a,b)=>uAtk(U[b])-uAtk(U[a]));

  if(r.war||r.vassal)return A;

function bindDip(r,i){const on=(id,fn)=>{const b=$(id);if(b)b.onclick=fn};const n=rivalName(r);

  on('#dAlly',()=>{s.res.gold-=dipCost(80);r.ally=true;r.rel+=10;inc('allies');log(`Союз с народом «${n}»!`,'good');REPORT.push([`Союз: ${n}`,'Союзник будет помогать войском в ваших войнах.','good']);sfx('good');save();render();openRival(i)});
  on('#dBreak',()=>{r.ally=false;r.rel-=20;log(`Союз с народом «${n}» разорван.`,'bad');save();render();openRival(i)});
  on('#dWed',()=>{s.res.gold-=dipCost(100);r.wed=true;r.rel=Math.min(100,r.rel+25);inc('weds');log(`Династический брак: дома старосты и народа «${n}» породнились.`,'good');sfx('good');save();render();openRival(i)});
  on('#dTrib',()=>{if(rnd()<tribChance(r)){r.trib=s.day+20;r.rel-=10;log(`Народ «${n}» согласился платить дань: 6 золота за ход, 20 ходов.`,'good');toast('Дань принята');inc('tribs')}

function startScn(x){newGame(x.cu,x.diff);ensureFeat();s.scn={id:x.id,end:0};x.setup();s.scn.end=s.day+x.lim;s.name=x.n;save();closeModal();hideTitle();tab='h';render();

function scnTurn(){if(!s.scn||s.scn.done)return;const x=SCN.find(y=>y.id===s.scn.id);if(!x)return;
  if(x.goal()){s.scn.done='win';SCND[x.id]=Date.now();try{localStorage.setItem('sixlands-scn',JSON.stringify(SCND))}catch(e){}achGive('scn');if(SCN.every(y=>SCND[y.id]))achGive('scnall');
    REPORT.push([`Испытание пройдено: ${x.n}`,'Отличная работа, староста! Можно продолжить партию или вернуться в меню.','good']);s.sumDue=1}
  else if(x.fail()){s.scn.done='fail';REPORT.push([`Испытание провалено: ${x.n}`,'Не вышло в этот раз. Попробуйте другую тактику.','bad']);s.sumDue=1}}
function scnHTML(){if(!s.scn)return'';const x=SCN.find(y=>y.id===s.scn.id);if(!x)return'';
  return`<button class="scnbar" id="scnBar"><b>Испытание: ${x.n}</b><span>${s.scn.done==='win'?'пройдено':s.scn.done==='fail'?'провалено':`${x.prog()} · осталось ${Math.max(0,s.scn.end-s.day)} ход.`}</span></button>`}

  REPORT.forEach(r=>{if(/Победа|войну|разграблен|Набег отбит|повержен|Союз|опустошил|разбит у стен|Испытание|Великий|Великая/.test(r[0])){if(!s.chron)s.chron=[];s.chron.push([s.day,r[0]]);if(s.chron.length>40)s.chron.shift()}})}
function score(){return Math.round(pop()*10+s.tech.known.length*15+s.civ.known.length*15+(s.relics||[]).length*30+(s.wins||0)*8+s.rivals.filter(r=>r.vassal).length*60+s.rivals.filter(r=>r.ally).length*30+mcount()*10+(s.hero?s.hero.lvl*10:0)+(s.won?500:0))}
function spark(H,k,col,lab){if(!H||H.length<2)return'';const W=300,Hh=70,mx=Math.max(1,...H.map(x=>x[k])),d0=H[0].d,d1=H[H.length-1].d;
  const pts=H.map(x=>`${((x.d-d0)/Math.max(1,d1-d0)*W).toFixed(1)},${(Hh-x[k]/mx*(Hh-6)-3).toFixed(1)}`).join(' ');
  return`<div class="spk"><div class="small"><b>${lab}</b> <span class="muted">макс. ${mx}</span></div><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`}
function openSummary(){const H=s.hist||[];
  openModal(`<h2>Итоги партии</h2><div class="small muted">${s.name||C().n} · ${C().full} · сложность ${DF().n} · ход ${s.day}${s.won?' · <b class="up">победа</b>':''}</div>
   <div class="sumscore"><span>Счёт</span><b>${score()}</b></div>
   <div class="sumgrid">${[['Семей',pop()],['Воинов',armySize()],['Побед в боях',s.wins||0],['Технологий',s.tech.known.length],['Институтов',s.civ.known.length],['Мастеров',mcount()],['Реликвий',(s.relics||[]).length],['Экспедиций',cntOf('exps')],['Приказов',cntOf('orders')],['Вассалов',s.rivals.filter(r=>r.vassal).length]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>
   ${spark(H,'p','#9fd28a','Население')}${spark(H,'a','#e48a6a','Армия')}${spark(H,'g','#e8c06a','Золото')}${spark(H,'t','#8ab8e8','Технологии и институты')}
   <h3>Летопись главного</h3>${(s.chron||[]).length?`<ul class="req">${s.chron.slice(-14).map(([d,t])=>`<li style="list-style:none"><span class="muted">Ход ${d}:</span> ${t}</li>`).join('')}</ul>`:'<div class="small muted">Пока ничего громкого.</div>'}
   <div class="row"><button class="btn" id="smX">Продолжить</button><button class="btn ghost" id="smM">Главное меню</button></div>`,true);

const GWM=Object.fromEntries(GW.map(g=>[g.id,g]));
function ensureGW(){if(!s.gw)s.gw={built:[],cur:null}}
const hasGW=id=>!!(s&&s.gw&&s.gw.built.includes(id));
const gwSum=k=>s&&s.gw?s.gw.built.reduce((a,id)=>a+(GWM[id][k]||0),0):0;
function gwReqOk(g){return g.req[0]==='t'?hasT(g.req[1]):hasC(g.req[1])}
function gwReqText(g){return g.req[0]==='t'?`технология «${TECH[g.req[1]].n}»`:`институт «${CIVIC[g.req[1]].n}»`}
function gwTurn(){ensureGW();const c=s.gw.cur;if(!c)return;c.left--;if(c.left>0)return;s.gw.built.push(c.id);s.gw.cur=null;inc('gw');const g=GWM[c.id];
  REPORT.push([`Великая стройка завершена: ${g.n}`,`${g.d} О вашей деревне говорят во всех шести землях. Слава +10.`,'good']);s.rep=Math.min(100,s.rep+10);sfx('good')}
function gwCard(g,o={}){const b=hasGW(g.id),cur=s.gw.cur&&s.gw.cur.id===g.id;
  return card({cls:`c-wonder ${!b&&!cur&&!gwReqOk(g)?'locked':''} ${o.cls||''}`,name:g.n,artCls:'cat',art:artOfRaw('gw_'+g.id,I('tower')),cost:o.cost&&!b&&!cur?costSpans(g.cost)+` ${g.t}<i class="ico i-turns"></i>`:'',text:g.d,tag:b?'Построено':cur?`Стройка: ${s.gw.cur.left} ход.`:'',tagCls:b?'gold':'arc',attrs:o.attrs||'',el:o.el})}

   <div class="cards">${GW.map(g=>gwCard(g,{cost:1,attrs:`data-gw="${g.id}"`})).join('')}</div>`;

const GOOD=Object.fromEntries(GOODS.map(x=>[x.id,x]));
function ensureTrade(){
  if(!s.market)s.market={wood:1,stone:1,food:1,mana:1};
  if(!s.cs)s.cs=Object.fromEntries(CITIES.map(c=>[c.id,{inf:0,war:false,own:false,gift:0}]));
  if(!s.goods)s.goods={list:[],at:0};
  if(!s.deals)s.deals={list:[],at:0};

const csLevel=c=>{const x=s.cs&&s.cs[c.id];if(!x)return 0;if(x.own)return 3;if(x.war)return-1;return x.inf>=60?2:x.inf>=30?1:0};
function csBonus(c){const l=csLevel(c);if(l<=0)return{};const b=l===1?c.b1:c.b2;if(l===3){const o={};for(const k in b)o[k]=Math.round(b[k]*1.5);return o}return b}
const csDef=()=>CITIES.reduce((a,c)=>a+(csBonus(c).def||0),0);
const csGiftCost=()=>Math.round(40+s.day*.35);
function goodsCost(x){return Math.round(x.cost*(1+s.day/200))}
function refreshTrade(){
  if(s.day>=s.goods.at){const pool=GOODS.slice().sort(()=>rnd()-.5);s.goods={list:pool.slice(0,3).map(x=>x.id),at:s.day+6}}
  if(s.day>=s.deals.at){const L=[];s.rivals.forEach((r,i)=>{if(r.war)return;for(let n=0;n<2;n++){const R=['gold','wood','stone','food','mana'];const give=R[(rnd()*5)|0];let get=R[(rnd()*5)|0];if(get===give)get=give==='gold'?'food':'gold';
      const val=30+((rnd()*30)|0)+s.day*.15;const rate=Math.max(.6,Math.min(1.5,(r.vassal?1.35:1)*(1+r.rel/250)));
      const pv=k=>k==='gold'?1:PRICE[k];L.push({r:i,give,ga:Math.round(val/pv(give)*rate),get,gb:Math.round(val/pv(get))})}});s.deals={list:L,at:s.day+6}}
}

 scout:{n:'Разведка',t:'rival',turns:2,base:.85,d:'Узнать точный состав армии соседа. 15 ходов вы видите их силы, а их набеги на вас слабее на 15%.',p:'a spy hiding in tall grass watching an enemy army camp through a small spyglass at dusk'},
 steal:{n:'Кража знаний',t:'rival',turns:4,base:.5,d:'Выкрасть чертежи и свитки: половина стоимости текущего исследования.',p:'a spy secretly copying glowing blueprints and scrolls by candlelight in an enemy library'},
 sabotage:{n:'Диверсия',t:'rival',turns:3,base:.55,d:'Поджечь склады и арсенал: армия соседа −20%, стены −25%.',p:'a spy escaping from a burning enemy armory at night, flames and smoke behind'},
 gold:{n:'Ограбление казны',t:'rival',turns:3,base:.6,d:'Вынести четверть золота из казны соседа (до 200).',p:'a spy sneaking out of a treasury vault with a sack of gold coins, guards sleeping nearby'},
 rig:{n:'Тайное влияние',t:'city',turns:3,base:.7,d:'Подкупить советников города-государства: влияние +25.',p:'a spy whispering to a city councilor in a shadowy corridor, passing a pouch of coins'},
 counter:{n:'Контрразведка',t:'home',turns:0,base:1,d:'Шпион остаётся дома и ловит вражеских лазутчиков.',p:'a vigilant spy-catcher with a lantern catching a hooded intruder on the village wall at night'}
};
const spyMax=()=>1+(hasT('writing')?1:0)+(hasT('math')?1:0)+(hasT('arcana')?1:0);
const spyCost=()=>50+25*s.spies.length+Math.round(s.day*.2);
const hasIntel=i=>i>=0&&s.intel&&s.intel[i]>s.day;
function spyChance(sp,k,tg){const m=MS[k];let c=spyCh(sp,m);
  if(m.t==='rival'){const r=s.rivals[tg];if(r.c==='east')c-=.1;if(r.war)c-=.05;if(r.vassal)c+=.15}
  return Math.max(.1,Math.min(.95,c))}
function spyRankHTML(sp){const nx=sp.lvl<4?SXP[sp.lvl+1]:0;
  return`<div class="vetbox"><div class="small">${SLV.map((n,i)=>i?`<div class="${i<=sp.lvl?'up':'muted'}">${i<=sp.lvl?'<i class="chev"><b></b></i>':'<i class="chev off"><b></b></i>'} <b>${n}</b> (${SXP[i]} усп.): ${SPERK[i]}</div>`:'').join('')}</div>
  ${nx?`<div class="bar"><i style="width:${Math.min(100,(sp.xp-SXP[sp.lvl])/(nx-SXP[sp.lvl])*100)}%"></i></div><div class="small muted">До звания «${SLV[sp.lvl+1]}»: ${nx-sp.xp} усп.</div>`:''}</div>`}
function spyCard(sp,o={}){const m=sp.m;const tag=!m?'Свободен':m.k==='counter'?'Охраняет':`${MS[m.k].n}: ${Math.max(0,m.end-s.day)} ход.`;
  return card({cls:`c-unit ${o.cls||''}`,name:sp.name,artCls:'cat',art:artOf('spy',I('lock')),text:`${SPYC[s.culture].n} · ${SLV[sp.lvl]}`,tag,tagCls:!m?'ok':m.k==='counter'?'gold':'arc',attrs:o.attrs||'',el:o.el})}
function msCard(k,o={}){const m=MS[k];return card({cls:`c-spell ${o.cls||''}`,name:m.n,artCls:'cat',art:artOfRaw('ms_'+k,I('spark')),text:m.d,attrs:o.attrs||'',el:o.el})}
function targetName(m){return m.t==='city'?CITY[m.tg].n:m.t==='rival'?rivalName(s.rivals[m.tg]):'Деревня'}
function openSpy(id){
  const sp=s.spies.find(x=>x.id===id);if(!sp)return;
  if(sp.m){openModal(`<div class="cv">${spyCard(sp,{cls:'big',el:'div'})}<div class="info"><h2>${sp.name}</h2><div class="muted">${SPYC[s.culture].n} · ${SLV[sp.lvl]} ${chev(sp.lvl)} · успехов: ${sp.xp}</div>${spyRankHTML(sp)}
      <p>${sp.m.k==='counter'?'Охраняет деревню от вражеских шпионов.':`Задание «${MS[sp.m.k].n}» — цель: ${targetName(sp.m)}. Вернётся через ${Math.max(0,sp.m.end-s.day)} ход. Шанс успеха ${Math.round(sp.m.ch*100)}%.`}</p>
      <div class="row"><button class="btn ghost" id="spRe">${sp.m.k==='counter'?'Снять с охраны':'Отозвать'}</button><button class="btn ghost" id="spX">Закрыть</button></div></div></div>`,true);
    $('#spX').onclick=closeModal;$('#spRe').onclick=()=>{sp.m=null;save();render();openSpy(id)};return}
  openModal(`<div class="cv">${spyCard(sp,{cls:'big',el:'div'})}<div class="info"><h2>${sp.name}</h2><div class="muted">${SPYC[s.culture].n} · ${SLV[sp.lvl]} ${chev(sp.lvl)} · успехов: ${sp.xp}</div>${spyRankHTML(sp)}
    <p class="small">Выберите задание. Опытный шпион справляется чаще. Если шпиона поймают, отношения с целью испортятся.</p></div></div>
    <div class="cards picker">${Object.keys(MS).map(k=>msCard(k,{attrs:`data-ms="${k}"`})).join('')}</div><button class="btn ghost" id="spX">Закрыть</button>`,true);
  $('#spX').onclick=closeModal;
  document.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>pickTarget(sp,b.dataset.ms));
}
function pickTarget(sp,k){
  const m=MS[k];
  if(m.t==='home'){sp.m={k,t:'home',end:s.day};sfx('card');log(`${sp.name} охраняет деревню.`);closeModal();save();render();return}
  const opts=m.t==='city'?CITIES.filter(c=>!s.cs[c.id].own&&!s.cs[c.id].war).map(c=>({tg:c.id,n:c.n,sub:`влияние ${Math.round(s.cs[c.id].inf)}`})):
    s.rivals.map((r,i)=>({tg:i,n:rivalName(r),sub:relText(r)})).filter(o=>!(k==='steal'&&!s.tech.cur));
  openModal(`<h2>${m.n}</h2><p class="small">${m.d} Займёт ${m.turns} ход.</p>${k==='steal'&&!s.tech.cur?'<p class="small dn">Сначала выберите исследование.</p>':''}
    <div class="stack">${opts.map(o=>{const ch=m.t==='city'?Math.min(.95,spyCh(sp,m)):spyChance(sp,k,o.tg);return`<button class="opt" data-tg="${o.tg}"><span><b>${o.n}</b><br><span class="small muted">${o.sub}</span></span><span class="p">${Math.round(ch*100)}%</span></button>`}).join('')}</div>
    <button class="btn ghost" id="tgX">Назад</button>`,true);
  $('#tgX').onclick=()=>openSpy(sp.id);
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const tg=m.t==='city'?b.dataset.tg:+b.dataset.tg;const ch=m.t==='city'?Math.min(.95,spyCh(sp,m)):spyChance(sp,k,tg);
    sp.m={k,t:m.t,tg,end:s.day+Math.max(1,m.turns-(sp.lvl>=3?1:0)),ch};sfx('card');log(`${sp.name} отправлен: ${m.n} (${targetName(sp.m)}).`);closeModal();save();render()});
}
function spyTurn(){
  s.spies.slice().forEach(sp=>{const m=sp.m;if(!m||m.k==='counter'||s.day<m.end)return;const M0=MS[m.k];const tn=targetName(m);
    if(rnd()<m.ch){let t='';const X=sp.lvl>=4?1.5:1;
      if(m.k==='scout'){s.intel[m.tg]=s.day+Math.round(15*X);t=`Мы знаем точный состав их армии на ${Math.round(15*X)} ходов.`}
      else if(m.k==='steal'){const c=s.tech.cur&&TECH[s.tech.cur];const v=Math.round((c?c.cost*.5:40)*X);s.tech.p+=v;t=`Украдено знаний: +${v} науки.`}
      else if(m.k==='sabotage'){const r=s.rivals[m.tg];r.army*=X>1?.7:.8;r.wall*=X>1?.65:.75;t=X>1?'Армия врага −30%, стены −35%.':'Армия врага −20%, стены −25%.'}
      else if(m.k==='gold'){const r=s.rivals[m.tg];const v=Math.min(Math.round(200*X),Math.round(r.gold*.25*X));r.gold-=v;s.res.gold+=v;t=`Добыто ${v}${RI.gold}.`}
      else if(m.k==='rig'){const x=s.cs[m.tg];const v=Math.round(25*X);x.inf=Math.min(100,x.inf+v);t=`Влияние +${v}.`}
      t+=spyXp(sp);
      REPORT.push([`Шпион: «${M0.n}» — успех`,`${sp.name} (${tn}). ${t}`,'good']);log(`${sp.name}: «${M0.n}» — успех. ${t}`,'good');sp.m=null;
    }else if(rnd()<Math.max(.1,.5-(sp.lvl>=2?.2:0)-.03*sp.lvl)){
      s.spies=s.spies.filter(x=>x!==sp);if(m.t==='rival')s.rivals[m.tg].rel-=15;if(m.t==='city')s.cs[m.tg].inf=Math.max(0,s.cs[m.tg].inf-20);
      REPORT.push([`Шпион пойман`,`${sp.name} схвачен (${tn}) во время задания «${M0.n}». ${m.t==='rival'?'Отношения −15.':'Влияние −20.'}`,'bad']);log(`${sp.name} пойман: ${tn}.`,'bad');
    }else{REPORT.push([`Задание сорвалось`,`${sp.name} не справился с заданием «${M0.n}» (${tn}), но сумел уйти.`,'bad']);sp.m=null}
  });
  // вражеские шпионы
  s.rivals.forEach(r=>{if(r.vassal||(r.rel>-10&&!r.war))return;if(rnd()>.025*CULTURES[r.c].aggr*(r.c==='east'?1.5:1))return;
    const guard=s.spies.filter(x=>x.m&&x.m.k==='counter');const catchCh=guard.length?Math.min(.92,.55+.08*Math.max(...guard.map(x=>x.lvl))):.15+(cnt('watchtower')?.1:0);const n=rivalName(r);
    if(rnd()<catchCh){r.rel-=8;guard.forEach(x=>spyXp(x));REPORT.push([`Пойман вражеский шпион`,`Лазутчик народа «${n}» схвачен${guard.length?' вашей контрразведкой':''}. Их замыслы сорваны.`,'good']);log(`Пойман шпион народа «${n}».`,'good');return}
    const k=['gold','steal','sabotage'][(rnd()*3)|0];let t;
    if(k==='gold'){const v=Math.round(s.res.gold*.12);s.res.gold-=v;r.gold+=v;t=`Из казны пропало ${v}${RI.gold}.`}
    else if(k==='steal'){const v=Math.round(s.tech.p*.3);s.tech.p-=v;t=`Украдены записи учёных: −${v} науки.`}
    else{const u=Object.keys(s.army).find(id=>s.army[id]>0);if(u){s.army[u]--;t=`Диверсия в лагере: потерян воин (${U[u].n}).`}else{const v=Math.round(s.res.food*.15);s.res.food-=v;t=`Поджог амбара: −${v}${RI.food}.`}}
    REPORT.push([`Вражеский шпион`,`Лазутчик народа «${n}» побывал в деревне. ${t} Назначьте шпиона на контрразведку.`,'bad']);log(`Вражеский шпион (${n}): ${t}`,'bad');
  });
}
function renderSpies(p){
  const max=spyMax(),cost=spyCost();
  p.innerHTML=`<div class="two" style="margin-bottom:12px"><div class="stack"><h3>Шпионы: ${s.spies.length}/${max}</h3>
    <div class="small">${SPYC[s.culture].n} — тайные агенты вашего народа. Разведка, кража знаний, диверсии, ограбление казны, влияние на города и охрана деревни.</div>
    <div class="small muted">Больше шпионов открывают технологии Письменность, Математика и Тайные искусства. Соседи с плохими отношениями тоже засылают лазутчиков.</div>
    <button class="btn" id="spN" ${s.spies.length<max&&s.res.gold>=cost?'':'disabled'}>Нанять: ${cost}${RI.gold}</button></div>
    <div class="stack"><h3>Разведданные</h3>${s.rivals.map((r,i)=>hasIntel(i)?`<div class="small">${CULTURES[r.c].ic} ${CULTURES[r.c].n}: армия ${Math.round(r.army)}, стены ${Math.round(r.wall*3)}, золото ${Math.round(r.gold)} <span class="muted">(ещё ${s.intel[i]-s.day} ход.)</span></div>`:'').join('')||'<div class="small muted">Нет свежих сведений. Отправьте шпиона на разведку.</div>'}</div></div>
    <div class="cards">${s.spies.map(sp=>spyCard(sp,{attrs:`data-sp2="${sp.id}"`})).join('')}</div>${s.spies.length?'':'<div class="small muted">Пока ни одного шпиона.</div>'}`;
  $('#spN').onclick=()=>{if(s.spies.length>=max||s.res.gold<cost)return;s.res.gold-=cost;const nm=`${SPYC[s.culture].n} «${CODEN[(rnd()*CODEN.length)|0]}»`;s.spies.push({id:s.spyId++,name:nm,lvl:0,xp:0,m:null});sfx('card');log(`Нанят шпион: ${nm}.`,'good');save();render()};
  p.querySelectorAll('[data-sp2]').forEach(b=>b.onclick=()=>openSpy(+b.dataset.sp2));
}

      <div class="small muted">Звания: за каждую победу отряды набираются опыта (за поражение — меньше). ${VR.slice(1).map(x=>`${x.n} +${Math.round(x.b*100)}%`).join(' · ')} к атаке.</div></div>

    p.querySelectorAll('[data-tac]').forEach(b=>b.onclick=()=>{s.tactic=b.dataset.tac;save();renderPane()});
  }else if(tab==='n'){
    p.innerHTML=`<p class="small muted" style="margin:0 0 12px">Соседние народы растут вместе с вами. Дарите подарки и торгуйте, чтобы жить в мире, или объявляйте войну и покоряйте их. Три победы над народом или его ослабление делают его вашим вассалом.</p><div class="cards">${s.rivals.map((r,i)=>rivalCard(r,{attrs:`data-rv="${i}"`})).join('')}</div>`;

  }else if(tab==='m'){

function musTick(){

    if(Math.random()<.9)pluck(AU.mus,ch[pat[beat]]+12+tr,t0,1.5,beat===0?.13:.08);

function howTo(){
  openModal(`<h2>Как играть</h2><div class="how">
   <p><b>Цель.</b> Выведите свою деревню к победе одним из четырёх путей: военным (покорить все 5 народов), научным (Великое открытие), культурным (Золотой век) или став Городом чудес.</p>
   <p><b>Ход.</b> Всё в игре пошаговое: стройте, нанимайте, исследуйте, а затем нажмите «Конец хода». Год длится 40 ходов, каждый сезон 10.</p>
   <p><b>Деревня.</b> Постройки ложатся на участки земли. Лесопилки работают только на опушке, каменоломни на склоне, колодцы маны сильнее на лей-узле. Дома дают места для семей, а семьи работают и платят налоги.</p>
   <p><b>Мастера.</b> Выполните условия мастера и поезжайте его уговаривать. Каждый мастер открывает свою лавку.</p>
   <p><b>Наука и культура.</b> Выбирайте технологии и институты в разделе «Развитие». Без выбора ход не наступит.</p>
   <p><b>Война.</b> Пехота бьёт конницу, конница бьёт стрелков и магов, стрелки и маги бьют пехоту, осадные машины ломают стены. Выбирайте тактику: Стена щитов бьёт Натиск, Натиск бьёт Обход, Обход бьёт Стену щитов.</p>
   <p><b>Торговля.</b> На рынке покупайте и продавайте ресурсы, у заезжих купцов — редкие товары, с соседями меняйтесь. Города-государства дают бонусы друзьям и союзникам, их можно и захватить. Берегитесь пиратов с моря.</p>
   <p><b>Свайпы.</b> Проведите пальцем влево или вправо, чтобы листать вкладки и разделы: Стол, Постройки, Мастера, Торговля, Война, Развитие.</p>
   <p><b>Подсказка.</b> Нажмите на любой ресурс, фишку на столе или карту, чтобы узнать подробности. Не хватает дерева или камня, купите их, нажав на ресурс.</p></div>
   <button class="btn" id="hwOk">Понятно</button>`,true);
  $('#hwOk').onclick=closeModal;
}

/* ---------- свайпы между разделами ---------- */
const SWIPE_ORDER=()=>NAV.flatMap(n=>n.subs.map(x=>x[0]));
function swipeGo(dir){
  const L=SWIPE_ORDER();let i=L.indexOf(tab);if(i<0)return;const j=i+dir;if(j<0||j>=L.length){bump(dir);return}
  const t=L[j];tab=t;lastSub[navOf(t).id]=t;renderPane();window.scrollTo({top:0});
  if(!RM){const el=t==='h'?$('#tableSec'):$('#panelSec');el.classList.remove('sw-l','sw-r');void el.offsetWidth;el.classList.add(dir>0?'sw-l':'sw-r');setTimeout(()=>el.classList.remove('sw-l','sw-r'),400)}
  const sb=document.querySelector('#subnav .on');if(sb)sb.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'});
}
function bump(dir){if(RM)return;const el=tab==='h'?$('#tableSec'):$('#panelSec');el.classList.remove('bump-l','bump-r');void el.offsetWidth;el.classList.add(dir>0?'bump-l':'bump-r')}
(()=>{let sx=0,sy=0,st=0,ok=false;
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){ok=false;return}const t=e.target;
    ok=!titleOn()&&$('#modalBg').hidden&&!t.closest('.filters,.subnav,#rivalsBar,.resbar,.tblw,input,textarea,.dock');
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
  document.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8)swipeGo(dx<0?1:-1)},{passive:true});
})();
$('#arrL').onclick=()=>{sfx('card');swipeGo(-1)};$('#arrR').onclick=()=>{sfx('card');swipeGo(1)};
$('#menuBtn').onclick=()=>{sfx('card');openPause()};
