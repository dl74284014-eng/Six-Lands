name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk SixLands.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SixLands-apk
          path: SixLands.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Шесть Земель
          body: Скачайте SixLands.apk ниже и установите на телефон.
          files: SixLands.apk
          make_latest: true
